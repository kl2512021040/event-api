<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Event Ticketing</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .navbar {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar .user-menu {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-nav {
            background: #34495e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-nav:hover { background: #455a64; }
        .btn-logout { background: #e74c3c; }
        .btn-logout:hover { background: #c0392b; }
        
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 25px; }
        .event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .event-card, .booking-card {
            background: white; border-radius: 8px; padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e8ed;
        }
        .booking-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .qr-img { width: 150px; height: 150px; display: block; margin: 10px auto; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-confirmed { background: #d4edda; color: #155724; }
        .badge-cancelled { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>EventHub (Customer)</h2>
        <div class="user-menu">
            <span id="navUserName">Selamat Datang</span>
            <button class="btn-nav" onclick="openProfileModal()">Profil</button>
            <button class="btn-nav btn-logout" onclick="clearSession()">Log Keluar</button>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchCustomerTab('events')">Jelajah Acara</button>
            <button class="tab-btn" onclick="switchCustomerTab('bookings')">Tiket & Tempahan Saya</button>
        </div>

        <div id="sectionEvents">
            <div class="search-bar">
                <input type="text" id="searchInput" class="form-control" placeholder="Cari nama acara...">
                <input type="text" id="cityInput" class="form-control" placeholder="Filter bandar (cth: Kuala Lumpur)">
                <button class="btn-primary" style="width: 150px;" onclick="loadEvents()">Cari</button>
            </div>
            <div id="eventsList" class="event-grid">
            </div>
        </div>

        <div id="sectionBookings" style="display: none;">
            <h3>Tiket Yang Telah Dibeli</h3>
            <br>
            <div id="bookingsList" class="booking-grid">
            </div>
        </div>
    </div>

    <div id="buyTicketModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalEventTitle">Beli Tiket</h3>
                <button class="close-btn" onclick="closeModal('buyTicketModal')">&times;</button>
            </div>
            <form id="buyTicketForm">
                <input type="hidden" id="modalEventId">
                <p style="margin-bottom: 10px;">Harga Seunit: <strong id="modalEventPrice">RM 0.00</strong></p>
                <div class="form-group">
                    <label for="ticketQty">Kuantiti Tiket</label>
                    <input type="number" id="ticketQty" class="form-control" value="1" min="1" required onchange="calculateTotal()">
                </div>
                <p style="margin-bottom: 15px;">Jumlah Bayaran: <strong id="modalTotalPrice" style="color: #27ae60; font-size: 18px;">RM 0.00</strong></p>
                <button type="submit" class="btn-primary">Sahkan Tempahan</button>
            </form>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Profil Pengguna</h3>
                <button class="close-btn" onclick="closeModal('profileModal')">&times;</button>
            </div>
            <div id="profileDetails">
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/customer.js"></script>
</body>
</html>
