```html
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk & Pendaftaran - Event Ticketing</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Event Ticketing System</h2>
            <p style="font-size: 14px; color: #666;">Sila log masuk atau daftar akaun baru</p>
        </div>

        <div id="alertMessage" class="alert" style="display: none;"></div>

        <div class="tabs">
            <button type="button" class="tab-btn active" onclick="switchTab('login')">Log Masuk</button>
            <button type="button" class="tab-btn" onclick="switchTab('register')">Daftar Akaun</button>
        </div>

        <form id="loginForm" action="javascript:void(0);" method="POST">
            <div class="form-group">
                <label for="loginEmail">Alamat E-mel</label>
                <input type="email" id="loginEmail" name="email" class="form-control" placeholder="contoh@gmail.com" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="loginPassword">Kata Laluan</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</button>
                </div>
            </div>
            <button type="submit" id="btnLoginSubmit" class="btn-primary">Log Masuk</button>
        </form>

        <form id="registerForm" action="javascript:void(0);" method="POST" style="display: none;">
            <div class="form-group">
                <label for="regFullName">Nama Penuh</label>
                <input type="text" id="regFullName" name="full_name" class="form-control" placeholder="Nama Anda" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="regEmail">Alamat E-mel</label>
                <input type="email" id="regEmail" name="email" class="form-control" placeholder="contoh@gmail.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="regPassword">Kata Laluan</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" name="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">Show</button>
                </div>
            </div>
            <input type="hidden" id="regRole" name="role" value="customer">
            <button type="submit" id="btnRegisterSubmit" class="btn-primary">Daftar Akaun Customer</button>
        </form>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
```
