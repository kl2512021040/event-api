<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Event Ticketing</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .navbar {
            background-color: #8e44ad;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar .user-menu { display: flex; gap: 10px; align-items: center; }
        .btn-nav {
            background: #9b59b6; color: white; border: none;
            padding: 8px 14px; border-radius: 4px; cursor: pointer;
        }
        .btn-nav:hover { background: #6c3483; }
        .btn-logout { background: #e74c3c; }
        .btn-logout:hover { background: #c0392b; }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table th, table td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        table th { background-color: #f8f9fa; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-super_admin { background: #f1c40f; color: #7f8c8d; }
        .badge-admin { background: #e8daef; color: #6c3483; }
        .badge-organiser { background: #d4efdf; color: #196f3d; }
        .badge-customer { background: #d6eaf8; color: #1b4f72; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>EventHub (System Admin)</h2>
        <div class="user-menu">
            <span id="navUserName">Selamat Datang Admin</span>
            <button class="btn-nav" onclick="openProfileModal()">Profil</button>
            <button class="btn-nav btn-logout" onclick="clearSession()">Log Keluar</button>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchAdminTab('users')">Pengurusan Pengguna</button>
            <button class="tab-btn" onclick="switchAdminTab('bookings')">Semua Tempahan Sistem</button>
        </div>

        <div id="sectionUsers">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Senarai Pengguna Terdaftar</h3>
                <button class="btn-primary" style="width: auto; padding: 8px 15px;" onclick="openCreateOrganiserModal()">+ Tambah Pengguna Baru</button>
            </div>
            <div class="card">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nama Penuh</th>
                                <th>Alamat E-mel</th>
                                <th>Peranan (Role)</th>
                                <th>Tarikh Daftar</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="sectionBookings" style="display: none;">
            <div class="card">
                <h3>Laporan Keseluruhan Tempahan Tiket</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Kod Tempahan</th>
                                <th>Nama Pelanggan</th>
                                <th>Acara</th>
                                <th>Kuantiti</th>
                                <th>Jumlah (RM)</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="allBookingsTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="createOrganiserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalUserTitle">Daftarkan Akaun Pengguna</h3>
                <button class="close-btn" onclick="closeModal('createOrganiserModal')">&times;</button>
            </div>
            <form id="createOrganiserForm">
                <div class="form-group">
                    <label>Nama Penuh / Syarikat</label>
                    <input type="text" id="orgFullName" class="form-control" placeholder="cth: Super Admin Hafiy" required>
                </div>
                <div class="form-group">
                    <label>Alamat E-mel</label>
                    <input type="email" id="orgEmail" class="form-control" placeholder="user@eventhub.com" required>
                </div>
                <div class="form-group">
                    <label>Kata Laluan</label>
                    <input type="password" id="orgPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group" id="roleSelectGroup">
                    <label>Peranan (Role)</label>
                    <select id="userRoleSelect" class="form-control">
                        <option value="customer">Customer (Pembeli Tiket)</option>
                        <option value="organiser">Organiser (Penganjur)</option>
                        <option value="admin">Admin System</option>
                        <option value="super_admin">Super Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Cipta Pengguna</button>
            </form>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Profil Pentadbir</h3>
                <button class="close-btn" onclick="closeModal('profileModal')">&times;</button>
            </div>
            <div id="profileDetails"></div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/admin.js"></script>
</body>
</html>
